name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Optional: add your real deploy step(s) here (Render/Railway/Fly/etc.)
      # - name: Deploy to Render
      #   run: |
      #     echo "Deploy step here"

      - name: Post-deploy healthcheck
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          RENDER_EXTERNAL_URL: ${{ secrets.RENDER_EXTERNAL_URL }}
        run: |
          BASE_URL="${HEALTHCHECK_URL:-$RENDER_EXTERNAL_URL}"

          if [ -z "$BASE_URL" ]; then
            echo "No HEALTHCHECK_URL/RENDER_EXTERNAL_URL set; skipping healthcheck for this environment."
            exit 0
          fi

          BASE_URL="${BASE_URL%/}"
          echo "Using BASE_URL=$BASE_URL"

          for i in {1..20}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL/v1/ready" || true)
            if [ "$code" = "200" ]; then
              echo "Ready check passed"
              exit 0
            fi
            echo "Attempt $i/20 not ready yet (HTTP $code), retrying..."
            sleep 5
          done

          echo "Deployment health check failed"
          exit 1